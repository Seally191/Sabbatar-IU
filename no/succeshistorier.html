<script>
function initCustomShorts() {
  document.querySelectorAll('.video-card').forEach(item => {

    item.addEventListener('click', () => {

      // 🚨 BLOCK if no consent
      const consent = localStorage.getItem("cookieConsent");
      if (consent !== "accepted") return;

      if (item.classList.contains('played')) return;

      const videoId = item.dataset.videoId;
      const wrapper = item.querySelector('.video-wrapper');
      const overlay = item.querySelector('.overlay');

      if (overlay) overlay.classList.add('hidden');

      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=0&rel=0&modestbranding=1&playsinline=1`;
      iframe.allow = "autoplay; encrypted-media; fullscreen";
      iframe.allowFullscreen = true;
      iframe.style.border = '0';

      wrapper.innerHTML = '';
      wrapper.appendChild(iframe);

      item.classList.add('played');
    });
  });
}

// Run after DOM ready
document.addEventListener("DOMContentLoaded", initCustomShorts);
</script>
