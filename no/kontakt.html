<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt oss</title>
    <link rel="stylesheet" href="../assets/css/general.css">
    <link rel="stylesheet" href="../assets/css/contact.css">
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon_io/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/img/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="../assets/img/favicon_io/site.webmanifest">
</head>
<body>

<div id="header-container"></div>
<script src="../assets/js/header.js"></script>
<script>
    fetch('header-no.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;
            
            document.dispatchEvent(new Event('header-loaded'));
        })
        .catch(err => console.error("Header load failed:", err));
</script>

<section id="contact">
    <h1>Kontakt Oss</h1>

    <!-- Netlify Contact Form -->
    <form id="contactForm">

        <div class="contact-row">
            <div class="contact-field">
                <label for="email">Din e-post:</label>
                <input type="email" id="email" name="email" required placeholder="din.epost@eksempel.com">
            </div>

            <div class="contact-field">
                <label for="phone">Ditt telefonnummer:</label>
                <input type="tel" id="phone" name="phone" required placeholder="30123456">
            </div>
        </div>

        <label for="message">Din melding:</label>
        <textarea id="message" name="message">
Hei Jobsun-team,

Jeg er interessert i å høre mer om deres jobbmuligheter i utlandet. Dere må gjerne fortelle meg hvordan jeg søker, og om det finnes ledige stillinger som passer min profil.

Jeg ser frem til å høre fra dere!
        </textarea>

        <button class="btn-primary" type="submit">Send Melding</button>
    </form>
</section>

<!-- Phone Contact Section -->
<section id="phone-contacts">
    <h1>Vil Du Heller Ringe?</h1>
    <p>Vårt team står klart til å hjelpe deg på flere språk.</p>

    <div class="contacts">

        <div class="contact-card">
            <h3 class="subheading">Alexander</h3>
            <p>Snakker: 🇩🇰🇬🇷🇬🇧</p>
            <a href="tel:+4542523737" class="call-btn">📞 Ring +45 42 52 37 37</a>
        </div>

        <div class="contact-card">
            <h3 class="subheading">Christoffer</h3>
            <p>Snakker: 🇩🇰🇳🇴🇬🇧</p>
            <a href="tel:+4581988163" class="call-btn">📞 Ring +45 81 98 81 63</a>
        </div>

        <div class="contact-card">
            <h3 class="subheading">Panagiotis</h3>
            <p>Snakker: 🇸🇪🇬🇷🇬🇧</p>
            <a href="tel:+4581957047" class="call-btn">📞 Ring +45 81 95 70 47</a>
        </div>

    </div>
</section>

<div id="footer-container"></div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        fetch('footer-no.html')
            .then(response => response.text())
            .then(data => document.getElementById('footer-container').innerHTML = data)
            .catch(error => console.log("Error loading footer:", error));
    });
</script> 

<script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        message: document.getElementById("message").value
    };

    try {
        const response = await fetch("https://contact-backend-afgn.onrender.com/send-email", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            window.location.href = "tak";
        } else {
            alert("Oops! Noe gikk galt.");
        }

    } catch (error) {
        console.error(error);
        alert("Error sending message");
    }
});
</script>

</body>
</html>
