<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV Builder</title>

    <link rel="stylesheet" href="../assets/css/general.css">
    <link rel="stylesheet" href="../assets/css/cv-generator.css">

    <link rel="icon" type="image/x-icon" href="../assets/img/favicon_io/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/img/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="../assets/img/favicon_io/site.webmanifest">
</head>

<body>

<div id="header-container"></div>

<script src="../assets/js/header.js"></script>
<script>
fetch('header-en.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('header-container').innerHTML = data;
        document.dispatchEvent(new Event('header-loaded'));
    })
    .catch(err => console.error("Header load failed:", err));
</script>


<section id="cv-generator">
    <div class="generator-container">

        <div class="progress-wrapper">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="progress-text">1 / 5</p>
        </div>

        <form class="cv-form"
              name="cv-generator"
              method="POST"
              data-netlify="true"
              netlify-honeypot="bot-field"
              action="/en/tak-for-nu">

            <input type="hidden" name="form-name" value="cv-generator">

            <p hidden>
                <label>Do not fill this out if you're human: <input name="bot-field"></label>
            </p>

            <!-- STEP 1 -->
            <div class="form-step active">
                <label>👤 Name</label>
                <input type="text" name="navn" placeholder="Your full name" required>

                <label>📱 Phone number</label>
                <input type="tel" name="telefon" placeholder="30123456" required>

                <label>✉️ Email</label>
                <input type="email" name="email" placeholder="your.email@example.com" required>

                <button type="button" class="btn-primary next-btn">Next</button>
            </div>

            <!-- STEP 2 -->
            <div class="form-step">
                <div class="semi-question">
                    <div class="Q1">
                        <label>🎓 Highest education</label>
                        <input type="text" name="uddannelse" placeholder="e.g. Bachelor in IT, University of Copenhagen" required>
                    </div>
                    <div class="Q2">
                        <label>📅 Year</label>
                        <input type="text" name="uddannelse_aar" placeholder="e.g. 2023" required>
                    </div>
                </div>

                <div class="semi-question">
                    <div class="Q1">
                        <label>💼 Latest job</label>
                        <input type="text" name="arbejde" placeholder="e.g. Barista at Espresso House, Aalborg" required>
                    </div>
                    <div class="Q2">
                        <label>📅 Year</label>
                        <input type="text" name="arbejde_aar" placeholder="e.g. 2025" required>
                    </div>
                </div>

                <p class="form-disclaimer">
                If it is not relevant to your profile, write it in the field and put 'N/A' in the year field.
                </p>

                <button type="button" class="btn-primary next-btn">Next</button>
            </div>

<!-- STEP 3 -->
<div class="form-step">

    <div class="mcq">
        <p>🧠 Your skill profile<br>(Please select at least one)</p>

        <div class="skills-grid">

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Communication">
                Communication
            </label>

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Technical understanding">
                Technical understanding
            </label>
                    
            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Time management">
                Time management
            </label>

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Attention to detail">
                Attention to detail
            </label>

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Customer focus">
                Customer focus
            </label>

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Teamwork">
                Teamwork
            </label>

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Patience">
                Patience
            </label>

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Adaptability">
                Adaptability
            </label>

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Multitasking">
                Multitasking
            </label>

            <label class="checkbox-option">
                <input type="checkbox" name="skills[]" value="Conflict management">
                Conflict management
            </label>

        </div>

    </div>

    <button type="button" class="btn-primary next-btn">Next</button>

</div>

            <!-- STEP 4 -->
            <div class="form-step">
                <div class="mcq">
                    <p>🇬🇧 English proficiency</p>

                    <label class="radio-option">
                        <input type="radio" name="engelsk" value="Basic" required>
                        Basic
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="engelsk" value="Intermediate">
                        Intermediate
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="engelsk" value="Fluent">
                        Fluent
                    </label>
                </div>

                <button type="button" class="btn-primary next-btn">Next</button>
            </div>

            <!-- STEP 5 -->
            <div class="form-step">
                <div class="mcq">
                    <p>✈️ When can you start a new job?</p>

                    <label class="radio-option">
                        <input type="radio" name="start" value="Immediately" required>
                        Immediately
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="start" value="In 1–3 months">
                        In 1–3 months
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="start" value="In more than 3 months">
                        In more than 3 months
                    </label>

                    <label class="checkbox-option">
                        <input type="checkbox" name="gdpr-consent" required>
                        <span>
                            By checking this box, you agree that your information will be collected by our company and shared with relevant partners to initiate the recruitment process.
                            Read more in our <a href="/en/privatlivspolitik.html" target="_blank">privacy policy</a>.
                        </span>
                    </label>

                <button type="submit" class="btn-primary next-btn">Create CV</button>
            </div>

        </form>
    </div>
</section>

<script src="../assets/js/cv-generator.js"></script>

</body>
</html>
